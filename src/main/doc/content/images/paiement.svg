<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827" />
    </marker>
    <style>
      .start { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; rx: 10; ry: 10; }
      .opt { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 10; ry: 10; }
      .end { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 700 20px 'Segoe UI', Tahoma, sans-serif; fill: #111827; }
      .txt { font: 14px 'Segoe UI', Tahoma, sans-serif; fill: #1f2937; }
      .line { stroke: #111827; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="20" y="34">Parcours de paiement</text>

  <rect class="start" x="20" y="70" width="300" height="90"/>
  <text class="txt" x="40" y="106">Mes tournois affiche un montant a regler</text>
  <text class="txt" x="40" y="130">La section Paiement apparait</text>

  <rect class="opt" x="380" y="30" width="300" height="110"/>
  <text class="txt" x="400" y="68">Option A: Payer par carte</text>
  <text class="txt" x="400" y="92">Redirection vers paiement securise</text>
  <text class="txt" x="400" y="116">Confirmation de paiement</text>

  <rect class="opt" x="380" y="170" width="300" height="110"/>
  <text class="txt" x="400" y="208">Option B: Virement bancaire</text>
  <text class="txt" x="400" y="232">Telecharger le RIB</text>
  <text class="txt" x="400" y="256">Validation apres reception</text>

  <rect class="opt" x="380" y="310" width="300" height="90"/>
  <text class="txt" x="400" y="348">Option C: Cheque / especes sur place</text>
  <text class="txt" x="400" y="372">Selon les modalites affichees</text>

  <rect class="end" x="760" y="150" width="300" height="130"/>
  <text class="txt" x="780" y="196">Resultat attendu:</text>
  <text class="txt" x="780" y="220">Statut de l'inscription = Paye</text>
  <text class="txt" x="780" y="244">Message Paiement effectue avec succes</text>

  <line class="line" x1="320" y1="110" x2="380" y2="85"/>
  <line class="line" x1="320" y1="118" x2="380" y2="225"/>
  <line class="line" x1="320" y1="126" x2="380" y2="355"/>

  <line class="line" x1="680" y1="85" x2="760" y2="185"/>
  <line class="line" x1="680" y1="225" x2="760" y2="215"/>
  <line class="line" x1="680" y1="355" x2="760" y2="245"/>
</svg>
