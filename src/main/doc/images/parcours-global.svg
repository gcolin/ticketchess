<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="240" viewBox="0 0 1160 240">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .title { font: 600 16px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .sub { font: 14px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
      .line { stroke: #1f2937; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="20" y="60" width="210" height="110"/>
  <text class="title" x="125" y="102" text-anchor="middle">Choisir un tournoi</text>
  <text class="sub" x="125" y="126" text-anchor="middle">Menu Tournois</text>

  <rect class="box" x="280" y="60" width="210" height="110"/>
  <text class="title" x="385" y="102" text-anchor="middle">S'inscrire</text>
  <text class="sub" x="385" y="126" text-anchor="middle">Recherche + Selection</text>

  <rect class="box" x="540" y="60" width="240" height="110"/>
  <text class="title" x="660" y="102" text-anchor="middle">Verifier Mes tournois</text>
  <text class="sub" x="660" y="126" text-anchor="middle">Statut de l'inscription</text>

  <rect class="box" x="840" y="20" width="290" height="80"/>
  <text class="title" x="985" y="58" text-anchor="middle">Payer si necessaire</text>
  <text class="sub" x="985" y="80" text-anchor="middle">Carte, virement ou sur place</text>

  <rect class="box" x="840" y="140" width="290" height="80"/>
  <text class="title" x="985" y="178" text-anchor="middle">Se desinscrire si besoin</text>
  <text class="sub" x="985" y="200" text-anchor="middle">Action depuis Mes tournois</text>

  <line class="line" x1="230" y1="115" x2="280" y2="115"/>
  <line class="line" x1="490" y1="115" x2="540" y2="115"/>
  <line class="line" x1="780" y1="95" x2="840" y2="60"/>
  <line class="line" x1="780" y1="135" x2="840" y2="180"/>
</svg>
