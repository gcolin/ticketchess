site_name: Ticket Chess — Documentation
site_description: Documentation utilisateur et guides opérationnels Ticket Chess
site_dir: ../../../target/mkdocs-site
docs_dir: content
use_directory_urls: false

validation:
  links:
    unrecognized_links: ignore

theme:
  name: readthedocs

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Accueil: index.md
  - Manuel utilisateur: MANUEL_UTILISATEUR.md
  - Manuel utilisateur (1 page): MANUEL_UTILISATEUR_1PAGE.md
  - Manuel organisateur: MANUEL_ORGANISATEUR.md
  - Synchronisation SharlyChess: SYNCHRO_SHARLYCHESS.md
  - Liste de contrôle pour les bénévoles: CHECKLIST_BENEVOLES_GUICHET.md
