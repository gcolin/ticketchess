legal.data.item.email=Adresses e-mail
legal.data.item.registration=Inscriptions aux tournois
legal.data.source=Ces données proviennent de la Fédération Française des Échecs et sont utilisées uniquement pour la gestion des inscriptions et la communication liée aux tournois.
legal.cookies.title=Cookies
legal.cookies.text=Le site utilise des cookies strictement nécessaires à son fonctionnement. Aucun cookie analytique ou publicitaire n'est utilisé.
legal.rights.title=Droits des utilisateurs
legal.rights.text=Conformément à la réglementation en vigueur, les utilisateurs disposent d'un droit d'accès, de rectification et de suppression de leurs données personnelles. Pour exercer ces droits, merci de contacter l'association à l'adresse e-mail indiquée ci-dessus.
