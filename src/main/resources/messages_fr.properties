legal.purpose.title=Objet du site
legal.purpose.text=Ce site permet la vente de billets pour les tournois d''échecs organisés par {0}.
legal.payment.title=Gestion des paiements
legal.payment.online=Les paiements en ligne sont sécurisés et réalisés via le prestataire Stripe. Stripe appliqué des frais de transaction sur les paiements par carte bancaire. En cas d'annulation, des frais bancaires s'appliquént sur les remboursements, ce qui entraîne un montant remboursé inférieur au montant initialement payé.
legal.payment.transfer=Les paiements par virement bancaire sont également acceptés. Merci de préciser votre nom et votre numéro FFE lors du règlement pour faciliter le traitement de votre inscription. Il n'y a pas de frais pour les paiements par virement.
legal.payment.dispute=En cas de litige lié à un paiement, merci de contacter l'association à l'adresse e-mail indiquée ci-dessus.
legal.users.title=Gestion des utilisateurs et des e-mails
legal.users.google=Les comptes utilisateurs et l'envoi des e-mails sont gérés par les prestataires d'identité et de messagerie configurés.
legal.users.auth=L'adresse e-mail du compte est stockée pour permettre l'authentification. Aucune autre donnée personnelle n'est collectée ni stockée par nos serveurs.
legal.data.title=Données personnelles
legal.data.collected=Dans le cadre de la vente de billets et de la gestion des tournois, les informations suivantes sont collectées :
