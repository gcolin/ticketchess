name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xmx2048m
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # exec:java would start com.github.gcolin.app.Main (pom exec plugin) and hang on Jetty.
      - name: Install Playwright Chromium
        run: |
          version=$(sed -n 's/.*<playwright.version>\([^<]*\)<\/playwright.version>.*/\1/p' pom.xml | head -n1)
          npx --yes "playwright@${version}" install --with-deps chromium

      - name: Build and test
        run: mvn -B -ntp verify -P integration

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/target/surefire-reports/TEST-*.xml"

      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mvn -B -ntp package -P pack,war -DskipTests

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/*.jar
            target/*.war
          if-no-files-found: error
          retention-days: 30
